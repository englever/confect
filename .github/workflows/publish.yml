name: Publish fork builds

on:
  workflow_call:
    inputs:
      publish:
        description: Publish after the caller's checks pass.
        required: true
        type: boolean
      n:
        description: Unused build number above all existing builds.
        required: false
        type: string
  pull_request:
    branches:
      - englever/main
  workflow_dispatch:
    inputs:
      version:
        description: Check this existing build without publishing. Use Packages to publish a new build.
        required: true
        type: string

permissions:
  contents: read

jobs:
  dry-run:
    name: Rename and pack
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/confect-setup
      - run: bun test ./scripts
      - run: pnpm check:pack-contents
      - name: Stage fork packages
        run: bun scripts/renameForGithubPackages.ts "$RUNNER_TEMP/confect-packages" "" --dry-run
      - name: Upload staged packages
        uses: actions/upload-artifact@v7
        with:
          name: confect-github-packages-dry-run
          path: |
            ${{ runner.temp }}/confect-packages/tarballs/*.tgz
            ${{ runner.temp }}/confect-packages/plan.json
          if-no-files-found: error

  publish:
    name: Publish to GitHub Packages
    if: inputs.publish == true && github.repository == 'englever/confect' && github.ref == 'refs/heads/englever/main' && github.event_name != 'pull_request' && inputs.version == ''
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.stage.outputs.version }}
    concurrency:
      group: englever-github-packages
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/confect-setup
      - run: bun test ./scripts
      - run: pnpm check:pack-contents
      - name: Configure GitHub Packages authentication
        run: |
          printf '%s\n' \
            '@englever:registry=https://npm.pkg.github.com' \
            '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$HOME/.npmrc"
      - name: Choose version and stage fork packages
        id: stage
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_NUMBER: ${{ inputs.n }}
        run: |
          bun scripts/renameForGithubPackages.ts "$RUNNER_TEMP/confect-packages" "$BUILD_NUMBER"
          jq -r '"version=\(.version)"' "$RUNNER_TEMP/confect-packages/plan.json" >> "$GITHUB_OUTPUT"
      - name: Publish staged tarballs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tarball in "$RUNNER_TEMP/confect-packages/tarballs/"*.tgz; do
            pnpm publish "$tarball" --no-git-checks --tag englever --registry https://npm.pkg.github.com
            package=$(tar -xOf "$tarball" package/package.json | jq -r '"\(.name)@\(.version)"')
            pnpm dist-tag add "$package" latest --registry https://npm.pkg.github.com
          done
      - name: Upload published build
        if: always() && steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: confect-github-packages-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/confect-packages/tarballs/*.tgz
            ${{ runner.temp }}/confect-packages/plan.json
          if-no-files-found: error

  install-check:
    name: Install and exercise a fresh consumer
    needs: [dry-run, publish]
    if: >-
      !cancelled() && github.repository == 'englever/confect' &&
      (needs.publish.result == 'success' ||
      (github.event_name == 'pull_request' && needs.dry-run.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.version != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      BUILD_VERSION: ${{ inputs.version || needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/bun-setup
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Download the PR's packed build
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v8
        with:
          name: confect-github-packages-dry-run
          path: ${{ runner.temp }}/confect-packages
      - name: Write the scratch consumer
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            version=$(jq -r '.version' "$RUNNER_TEMP/confect-packages/plan.json")
            bun scripts/consumerFixture.ts "$RUNNER_TEMP/confect-consumer" "$version" "$RUNNER_TEMP/confect-packages/tarballs"
          else
            bun scripts/consumerFixture.ts "$RUNNER_TEMP/confect-consumer" "$BUILD_VERSION"
          fi
          # pnpm 12 ignores interpolated credentials in a project .npmrc.
          printf '%s\n' \
            '@englever:registry=https://npm.pkg.github.com' \
            '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$HOME/.npmrc"
      - name: Install the build with strict peers
        working-directory: ${{ runner.temp }}/confect-consumer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm install --strict-peer-dependencies
          bash install-command.txt
          rm "$HOME/.npmrc"
      - name: Generate code with the installed CLI
        working-directory: ${{ runner.temp }}/confect-consumer
        run: |
          pnpm confect codegen --component-dir components/counter/convex
          pnpm confect codegen
      - name: Typecheck the consumer
        working-directory: ${{ runner.temp }}/confect-consumer
        run: pnpm exec tsc --noEmit
      - name: Exercise the declaration, component and callback
        working-directory: ${{ runner.temp }}/confect-consumer
        run: pnpm exec vitest run
      - name: Print the verified install command
        if: github.event_name != 'pull_request'
        working-directory: ${{ runner.temp }}/confect-consumer
        run: |
          {
            echo 'INSTALL COMMAND:'
            cat install-command.txt
            echo
            echo 'Registry: @englever:registry=https://npm.pkg.github.com in ~/.npmrc (trusted user config).'
            echo 'Authentication: //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}; token needs packages:read.'
            echo 'Use the generated package.json for the pinned consumer and test dependencies.'
            echo 'pnpm-workspace.yaml (peer overrides, fresh-build exclusions and build policy):'
            cat pnpm-workspace.yaml
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the consumer lockfile and install recipe
        uses: actions/upload-artifact@v7
        with:
          name: confect-consumer-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/confect-consumer/pnpm-lock.yaml
            ${{ runner.temp }}/confect-consumer/package.json
            ${{ runner.temp }}/confect-consumer/pnpm-workspace.yaml
            ${{ runner.temp }}/confect-consumer/install-command.txt
          if-no-files-found: error
